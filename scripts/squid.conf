# Squid Configuration for Tailscale Proxy
# Restricted strictly to Tailscale subnet (100.64.0.0/10)

# Listen on default proxy port
http_port 3128

# Define Tailscale and Localhost ACLs
acl tailscale src 100.64.0.0/10
acl localhost src 127.0.0.1/32 ::1

# Define Safe and SSL Ports
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 1025-65535  # unregistered ports
acl CONNECT method CONNECT

# Port Security Rules
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Access Control Rules
http_access allow localhost
http_access allow tailscale
http_access deny all

# Anonymity Configuration
# Prevent proxy details and origin client IP leaking in headers
via off
forwarded_for delete

# Strip additional identifying headers
request_header_access From deny all
request_header_access Server deny all
